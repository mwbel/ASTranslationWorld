<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemini 4 藏文整页识别对照</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1c2632; background: #f4f6f8; }
    body { margin: 0; } header { padding: 20px 24px; background: #18334b; color: white; }
    h1 { font-size: 22px; margin: 0 0 8px; } p { margin: 6px 0; }
    .controls { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; padding: 16px 24px; background: white; border-bottom: 1px solid #dce2e8; }
    label { display: grid; gap: 5px; font-size: 13px; } button, input { font: inherit; }
    button { padding: 8px 12px; border: 1px solid #9caebb; border-radius: 7px; background: white; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; } #runPage, #runAll { background: #246399; border-color: #246399; color: white; }
    #status { margin: 12px 24px; padding: 10px 14px; background: #e5eff7; border-radius: 7px; min-height: 20px; }
    #status.error { color: #9a1f20; background: #fde8e8; }
    main { display: grid; grid-template-columns: minmax(300px, 1.2fr) minmax(300px, 1fr) minmax(300px, 1fr); gap: 14px; padding: 0 24px 24px; }
    section { background: white; border: 1px solid #dce2e8; border-radius: 9px; padding: 12px; min-width: 0; }
    h2 { font-size: 16px; margin: 0 0 10px; } canvas { display: block; max-width: 100%; height: auto; margin: auto; }
    .scan { max-height: 75vh; overflow: auto; } textarea { display: block; box-sizing: border-box; width: 100%; min-height: 70vh; resize: vertical; font: 17px/1.7 sans-serif; }
    small { color: #566876; } @media(max-width: 1000px) { main { grid-template-columns: 1fr; } textarea { min-height: 260px; } }
  </style>
</head>
<body>
  <header><h1>Gemini 4 藏文整页识别对照</h1><p>原图逐页识别。正确校对文本仅供对照，识别结果可导出为 TXT。</p></header>
  <div class="controls">
    <label>原始 PDF<input id="pdfFile" type="file" accept="application/pdf,.pdf"></label>
    <label>正确校对 Markdown<input id="referenceFile" type="file" accept=".md,text/markdown,text/plain"></label>
    <button id="previous">上一页</button><strong id="pageNumber">未加载 PDF</strong><button id="next">下一页</button>
    <button id="runPage">识别当前页</button><button id="runAll">依次识别全部页</button><button id="stop">停止批量</button><button id="export">导出识别 TXT</button>
  </div>
  <p id="status" role="status">请选择原始 PDF 和正确校对 Markdown。请先在已设置 GEMINI_API_KEY 的终端运行 gemini4_compare_service.sh start；Gemini 4 key 需具备付费额度。</p>
  <main>
    <section><h2>原图</h2><div class="scan"><canvas id="pageCanvas"></canvas></div></section>
    <section><h2>Gemini 4 识别结果</h2><small id="recognitionMeta">本页尚未重新识别</small><textarea id="recognizedText" readonly aria-label="Gemini 4 识别结果"></textarea></section>
    <section><h2>正确校对文本</h2><textarea id="referenceText" readonly aria-label="正确校对文本"></textarea></section>
  </main>
  <script src="./vendor/pdf.min.js"></script>
  <script src="./gemini38-compare.js"></script>
</body>
</html>
